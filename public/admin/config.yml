backend:
  name: github
  repo: your-username/your-repository # Укажите ваш GitHub репозиторий (например: username/coffeeshtob)
  branch: main

# Local backend for local offline development (runs decap-server if needed)
local_backend: true

# Media / Uploads configuration
media_folder: "public/images"
public_folder: "/images"

# Localization & Display
locale: "ru"
display_url: "/"
logo_url: "/images/coffee_cup_porcelain_1787950388595.jpg"

collections:
  - name: "content_management"
    label: "Управление сайтом"
    delete: false
    editor:
      preview: false
    files:
      - file: "public/content.json"
        name: "site_content"
        label: "Все разделы сайта «Кофештаб»"
        fields:
          # 1. ШАПКА И НАВИГАЦИЯ
          - name: "header"
            label: "1. Шапка и навигация"
            widget: "object"
            fields:
              - { label: "Название кофейни", name: "brandName", widget: "string" }
              - { label: "Подзаголовок бренда", name: "brandSubtitle", widget: "string" }
              - { label: "Текст кнопки соцсетей", name: "socialsButtonText", widget: "string" }
              - { label: "Заголовок окна соцсетей", name: "socialsModalTitle", widget: "string" }
              - name: "socials"
                label: "Список соцсетей в окне"
                widget: "list"
                fields:
                  - { label: "Идентификатор (tg / vk / guide)", name: "id", widget: "string" }
                  - { label: "Название соцсети", name: "title", widget: "string" }
                  - { label: "Ссылка (URL)", name: "url", widget: "string" }
              - name: "navItems"
                label: "Пункты меню навигации"
                widget: "list"
                fields:
                  - { label: "ID секции (якорь)", name: "id", widget: "string" }
                  - { label: "Название пункта меню", name: "label", widget: "string" }

          # 2. ГЛАВНЫЙ ЭКРАН (HERO)
          - name: "hero"
            label: "2. Главный экран (Hero)"
            widget: "object"
            fields:
              - { label: "Фоновое изображение", name: "bgImage", widget: "image" }
              - { label: "Плашка с адресом", name: "locationBadge", widget: "string" }
              - { label: "Главный заголовок", name: "title", widget: "string" }
              - { label: "Основной текст", name: "description", widget: "text" }
              - { label: "Текст кнопки 1 (Меню)", name: "primaryButtonText", widget: "string" }
              - { label: "Текст кнопки 2 (О штабе)", name: "secondaryButtonText", widget: "string" }

          # 3. О ШТАБЕ
          - name: "about"
            label: "3. О штабе"
            widget: "object"
            fields:
              - { label: "Метка раздела (О ШТАБЕ)", name: "sectionTag", widget: "string" }
              - { label: "Заголовок раздела", name: "title", widget: "string" }
              - { label: "Главная фотография дома", name: "image", widget: "image" }
              - { label: "Город (плашка на фото)", name: "badgeCity", widget: "string" }
              - { label: "Улица и дом (плашка на фото)", name: "badgeStreet", widget: "string" }
              - { label: "Подпись на фото", name: "badgeSub", widget: "string" }
              - name: "paragraphs"
                label: "Абзацы текста истории"
                widget: "list"
                field: { label: "Абзац текста", name: "paragraph", widget: "text" }
              - name: "features"
                label: "Карточки преимуществ"
                widget: "list"
                fields:
                  - { label: "ID", name: "id", widget: "string" }
                  - { label: "Иконка (Sprout / Sparkles / Users / BookOpen)", name: "icon", widget: "string" }
                  - { label: "Заголовок преимущества", name: "title", widget: "string" }
                  - { label: "Описание", name: "description", widget: "text" }

          # 4. МЕНЮ И НАПИТКИ
          - name: "menu"
            label: "4. Меню кофейни"
            widget: "object"
            fields:
              - { label: "Метка раздела (ЧЕМ УГОЩАЕМ)", name: "sectionTag", widget: "string" }
              - { label: "Заголовок раздела", name: "title", widget: "string" }
              - { label: "Подзаголовок раздела", name: "subtitle", widget: "string" }
              - { label: "Текст бейджа о фарфоре", name: "porcelainBadge", widget: "string" }
              - name: "highlightCards"
                label: "Главные позиции меню (с фото)"
                widget: "list"
                fields:
                  - { label: "ID", name: "id", widget: "string" }
                  - { label: "Название позиции", name: "title", widget: "string" }
                  - { label: "Описание", name: "description", widget: "text" }
                  - { label: "Фотография блюда / напитка", name: "image", widget: "image" }
              - { label: "Метка блока других напитков", name: "additionalDrinksTag", widget: "string" }
              - { label: "Заголовок блока других напитков", name: "additionalDrinksTitle", widget: "string" }
              - name: "additionalDrinks"
                label: "Список дополнительных напитков и выпечки"
                widget: "list"
                fields:
                  - { label: "Название", name: "title", widget: "string" }
                  - { label: "Описание", name: "desc", widget: "string" }

          # 5. ЖИЗНЬ ШТАБА (КВАРТИРНИКИ И 3D-ПЕЧАТЬ)
          - name: "eventsAndCraft"
            label: "5. Жизнь штаба (Квартирники и 3D-печать)"
            widget: "object"
            fields:
              - { label: "Метка раздела (ЧЕМ ЖИВЕМ)", name: "sectionTag", widget: "string" }
              - { label: "Заголовок раздела", name: "title", widget: "string" }
              - { label: "Подзаголовок раздела", name: "subtitle", widget: "string" }
              - name: "cards"
                label: "Карточки событий и мастерской"
                widget: "list"
                fields:
                  - { label: "ID", name: "id", widget: "string" }
                  - { label: "Заголовок карточки", name: "title", widget: "string" }
                  - { label: "Описание", name: "description", widget: "text" }
                  - { label: "Примечание", name: "note", widget: "text" }
                  - { label: "Фотография", name: "image", widget: "image" }
                  - { label: "Иконка (Music / Printer)", name: "icon", widget: "string" }

          # 6. ГРАФИК РАБОТЫ И ГОСТЯМ ГОРОДА
          - name: "hoursAndTourists"
            label: "6. График работы и Гостям города"
            widget: "object"
            fields:
              - { label: "Метка раздела (КАК НАС НАЙТИ)", name: "sectionTag", widget: "string" }
              - { label: "Заголовок раздела", name: "title", widget: "string" }
              - { label: "Подзаголовок раздела", name: "subtitle", widget: "string" }
              - name: "hoursCard"
                label: "Карточка графика работы"
                widget: "object"
                fields:
                  - { label: "Заголовок блока", name: "title", widget: "string" }
                  - { label: "Основное расписание (часы)", name: "mainSchedule", widget: "string" }
                  - { label: "Примечание дежурных", name: "note", widget: "text" }
              - name: "touristsCard"
                label: "Карточка гостям города"
                widget: "object"
                fields:
                  - { label: "Заголовок блока", name: "title", widget: "string" }
                  - { label: "Описание для туристов", name: "description", widget: "text" }
                  - { label: "Текст кнопки гида", name: "buttonText", widget: "string" }
                  - { label: "Ссылка на гид (URL)", name: "buttonUrl", widget: "string" }
              - name: "crossingBanner"
                label: "Баннер переправы через Волгу"
                widget: "object"
                fields:
                  - { label: "Заголовок", name: "title", widget: "string" }
                  - { label: "Описание переправы", name: "description", widget: "text" }

          # 7. ПОДВАЛ (ФУТЕР) И КОНТАКТЫ
          - name: "footer"
            label: "7. Подвал (Футер) и контакты"
            widget: "object"
            fields:
              - { label: "Название бренда", name: "brandName", widget: "string" }
              - { label: "Подзаголовок бренда", name: "brandSubtitle", widget: "string" }
              - { label: "Краткое описание", name: "description", widget: "text" }
              - { label: "Заголовок адреса", name: "addressTitle", widget: "string" }
              - { label: "Адрес", name: "address", widget: "string" }
              - { label: "Ориентир на местности", name: "landmark", widget: "string" }
              - { label: "Заголовок блока навигации", name: "navTitle", widget: "string" }
              - { label: "Заголовок блока соцсетей", name: "socialsTitle", widget: "string" }
              - { label: "Ссылка на Telegram (URL)", name: "telegramUrl", widget: "string" }
              - { label: "Ссылка на ВКонтакте (URL)", name: "vkUrl", widget: "string" }
              - { label: "Ссылка на гид по городу (URL)", name: "guideUrl", widget: "string" }
              - { label: "Текст копирайта", name: "copyright", widget: "string" }
