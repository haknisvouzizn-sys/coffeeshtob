<!doctype html>
<html lang="ru" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Кофештаб · Романов (Тутаев)</title>
    <meta name="description" content="Кофештаб — маленькая кофейня на левом берегу Волги в Романове (Тутаев). Волжская набережная, 19." />
    <meta property="og:title" content="Кофештаб · Романов" />
    <meta property="og:description" content="Кофештаб — маленькая кофейня на левом берегу Волги в Романове (Тутаев). Волжская набережная, 19." />
    <meta property="og:type" content="website" />
    
    <!-- Netlify Identity Widget for Decap CMS authentication and invites -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    
    <!-- Modern Editorial Font Pairing for Artisanal Coffee House -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Golos+Text:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FAF7F2] text-[#2C1F16] antialiased selection:bg-[#BC6C3F]/20 selection:text-[#382015]">
    <div id="root"></div>
    
    <!-- Netlify Identity redirect script to send authenticated users to /admin/ -->
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", function(user) {
          if (!user) {
            window.netlifyIdentity.on("login", function() {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
